<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f10" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>골목 가게</title>
<meta name="description" content="thisjonghoon 가게 주인과 에이전트의 대화 창">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/ui.css">
<style>
/* chat-only parts; the shared look is in /ui.css (see app/DESIGN.md) */
.app{height:var(--app-h,100dvh);display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);background:var(--bg)}
/* wide screens (iPad landscape, PC): the header spans the width like 현황's; the talk and the input keep a 760 px column (11/24) */
#log{max-width:728px;margin:0 auto}
#scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 8px}
.empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 8px;gap:8px}
.empty .avatar{width:60px;height:60px;border-radius:16px;font-size:24px;box-shadow:var(--shadow-2)}
.empty h2{margin:10px 0 0;font-size:20px;letter-spacing:-.02em}
.empty p{margin:0;color:var(--text-mute);font-size:13px;max-width:280px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--text-soft)}
.chip:active{background:var(--hover)}
.row{display:flex;margin:3px 0}
.row.me{justify-content:flex-end}
.bubble{max-width:80%;padding:9px 14px;border-radius:18px;line-height:1.6;letter-spacing:-.005em;white-space:pre-wrap;overflow-wrap:anywhere;animation:in .2s var(--ease)}
.bubble code{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgb(127 127 127 / .18);padding:1px 5px;border-radius:6px}.bubble .mh{display:inline-block;font-size:1.05em}.bubble a{color:inherit;text-decoration:underline}
.me .bubble{background:var(--accent-soft);color:var(--text);border-bottom-right-radius:6px}
.me.pending .bubble{opacity:.5}
.agent .bubble,.other .bubble{background:var(--card);border-bottom-left-radius:6px}
.name{font-size:12px;color:var(--text-mute);margin:12px 0 3px 4px}
.sys{text-align:center;color:var(--text-mute);font-size:12px;margin:12px 0;white-space:pre-line;word-break:keep-all;margin-inline:auto}
.card{margin:8px 0;background:var(--raised);border:1px solid var(--line);box-shadow:var(--shadow-2);border-radius:12px;padding:12px 14px;max-width:80%}
.card .k{font-size:12px;font-weight:700;color:var(--text-mute)}
.card b{display:block;margin-top:2px}
.card div{white-space:pre-wrap;color:var(--text-soft);font-size:14px;margin-top:2px}
.typing .bubble{display:flex;gap:4px;padding:14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--text-mute);animation:pulse 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
footer{padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--bg)}
form{display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid transparent;border-radius:22px;
  padding:5px 5px 5px 16px;transition:border-color .12s}
form:focus-within{border-color:var(--focus)}
textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;font-size:16px;
  line-height:1.4;padding:10px 0;max-height:140px}
/* the rounded box shows focus (form:focus-within); no square ring on the field inside it (11/24) */
textarea:focus,textarea:focus-visible{outline:none}
textarea::placeholder{color:var(--text-mute)}
.send{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;
  transition:opacity .12s}
.send:disabled{background:var(--hover);color:var(--text-mute);cursor:not-allowed}
.other .bubble{background:var(--bubble-strong);color:var(--bubble-strong-ink)}
/* claude's messages sit on the right like the owner's, in the soft orange, with its name above (11/24) */
.row.other{justify-content:flex-end}
.other .bubble{border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.row.turn{margin-top:12px}
.me .bubble,.agent .bubble{box-shadow:inset 0 0 0 1px var(--line-strong)}
.bubble .quote{display:block;margin:0 0 8px;padding:6px 10px;border-left:2px solid var(--accent-ink);border-radius:2px 8px 8px 2px;
  background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--text-soft);font-size:12px;line-height:1.5;letter-spacing:0}
.bubble .quote{cursor:pointer}
.bubble.found{position:relative;z-index:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--primary);transition:box-shadow .2s}
.bubble .quote:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.jump-note{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:20;padding:6px 12px;border-radius:999px;
  background:var(--text);color:var(--bg);font-size:12px}
.other .bubble .quote{border-left-color:currentColor;color:inherit;opacity:.85}
.bubble .by{display:block;text-align:right;margin-top:4px;font-size:12px}
.bubble .by .who{opacity:1}
/* times and dates like the owner's Telegram (11/25): a 24-hour time at the bottom right of every bubble, a date pill
   when the day changes, and the same pill pinned at the top while scrolling */
.bubble{position:relative}
.bubble .gap{display:inline-block;width:48px;height:1px}
.bubble>.stamp{position:absolute;right:14px;bottom:8px;font-size:12px;line-height:1.6;color:inherit;opacity:.72}
.bubble .by .stamp{margin:0 0 0 8px;font-size:12px;color:inherit}
.day{display:flex;justify-content:center;margin:16px 0 8px}
.day span,.daytip span{padding:4px 12px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--text-soft);
  font-size:12px;line-height:1.45}
#scroll{position:relative}
.daytip{position:sticky;top:8px;z-index:5;height:0;display:flex;justify-content:center;align-items:flex-start;overflow:visible;opacity:0;transition:opacity .2s;
  pointer-events:none}
.daytip span{background:color-mix(in srgb,var(--bg) 90%,var(--text) 10%);border-color:var(--line-strong);box-shadow:var(--shadow-2)}
.daytip.on{opacity:1}
@media (prefers-reduced-motion:reduce){.daytip{transition:none}}
/* reply: long-press (phone) or right-click (PC) a message, then 답장 or 복사 (11/24) */
.bubble{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.msgmenu{position:fixed;z-index:20;display:flex;gap:4px;padding:4px;background:var(--raised);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-2)}
.msgmenu button{min-height:40px;padding:0 16px;border:0;border-radius:8px;background:transparent;font-weight:700}
.msgmenu button:hover,.msgmenu button:focus-visible{background:var(--hover)}
.app>*{min-width:0}
.replybar{max-width:100%;display:flex;align-items:center;gap:8px;margin:0 4px 8px;padding:4px 4px 4px 12px;border-radius:12px;
  background:var(--accent-soft);color:var(--text-soft);font-size:13px}
.replybar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.replybar button{flex:none;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:inherit}
.shade{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:10;
  animation:fade .2s var(--ease)}
.sheet{width:100%;max-width:560px;max-height:84dvh;overflow-y:auto;background:var(--raised);border-radius:16px 16px 0 0;box-shadow:var(--shadow-3);
  padding:8px 20px calc(20px + env(safe-area-inset-bottom));animation:up .32s var(--ease)}
@media (min-width:600px){.shade{align-items:center}.sheet{border-radius:16px;padding-bottom:20px}}
.grip{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 16px}
.sheet h2,.sheet h3{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}
.sheet .sub{color:var(--text-mute);font-size:13px;margin:0 0 16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{min-height:46px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);font-weight:600}
.actions .yes{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.actions button:active{transform:scale(.98)}
.credit{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--text-mute);font-size:12px;text-align:center}
.credit a{color:var(--text-soft);text-decoration:none;font-weight:600}
@keyframes up{from{transform:translateY(32px);opacity:0}}
@keyframes fade{from{opacity:0}}
html,body{height:100%;overflow:clip;overscroll-behavior:none}
/* the chat page never scrolls as a whole: only the message list does (11/24) */
.app{position:fixed;inset:0 0 auto 0;top:var(--app-y,0px);margin:0 auto}
#scroll{overscroll-behavior:contain}
/* a home-screen app has no browser bar under the page: keep the message box off the home indicator (11/24) */
@media (display-mode:standalone){footer{padding-bottom:max(28px,calc(12px + env(safe-area-inset-bottom)))}}
.app>footer{padding-left:max(12px,calc((100% - 760px) / 2 + 16px));padding-right:max(12px,calc((100% - 760px) / 2 + 16px))}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body{overscroll-behavior:none}
</style>
</head>
<body>
<div class="app">
  <header class="wide">
    <div class="avatar" id="av">A</div>
    <div class="who"><h1 id="nm">Agent</h1><div class="status" id="st"><span class="dot"></span><span id="stt">연결하는 중</span></div></div>
    <nav class="seg" aria-label="화면"><a href="/" aria-current="page">채팅</a><a href="/dashboard.html">현황</a></nav>
  </header>
  <div id="scroll" role="main"><div class="daytip" id="daytip" aria-hidden="true"><span></span></div><div id="log"></div></div>
  <footer>
    <div class="replybar" id="replybar" hidden><span id="replytext"></span>
      <button type="button" id="replyx" aria-label="답장 취소">✕</button></div>
    <form id="f">
      <textarea id="t" rows="1" placeholder="메시지 보내기" enterkeyhint="send" autocomplete="off"></textarea>
      <button class="send" id="go" aria-label="보내기" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
  </footer>
</div>
<div class="shade" id="consent" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="consent-h">
  <div class="grip"></div>
  <h2 id="consent-h">에이전트가 허락을 구합니다</h2>
  <p class="sub" id="cname"></p>
  <div class="kv" id="cargs"></div>
  <div class="actions"><button type="button" id="no">거절</button><button type="button" class="yes" id="yes">허용</button></div>
</div></div>
<script src="/miniapp.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// a reply's quote line ("> who: "…"" first) drawn apart from the words after it (11/24); everything stays escaped
const KIT_LINES = {'(the agent is busy; ask again)': '에이전트가 2분 안에 답하지 않았어요.\n메시지는 그대로 있으니 잠시 뒤 다시 물어봐 주세요.'};
// Chat bubbles (agent, owner, Claude) show light Markdown (**bold**, lists, `code`) formatted (11/26, owner). Everything is
// escaped first, so only these few marks become tags and nothing the agent writes can inject HTML.
const md = s => esc(s).split('\n').map(line => {
  let l = line.replace(/^#{1,4} (.+)$/, '<b class="mh">$1</b>').replace(/^(\s*)[-*•] (?=\S)/, '$1• ');
  return l.replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(?=\S)([^*]*?\S)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*(?=\S)([^*]*?\S)\*(?=[\s).,!?:;]|$)/g, '$1<i>$2</i>')
    .replace(/~~(?=\S)([^~]*?\S)~~/g, '<s>$1</s>')
    .replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}).filter(l => !/^\s*```/.test(l)).join('\n');   // code-fence lines are dropped; their contents stay as text
const body = (t, fmt = true) => { const q = /^(?:>|↪\uFE0F?) ([^\n]*)\n([\s\S]*)$/.exec(String(t ?? '')); const f = fmt ? md : esc; return q ? `<span class="quote" role="button" tabindex="0" title="원문으로">${esc(q[1])}</span>${f(q[2])}` : f(t); };
// The owner talks to the agent here (11/23, decision 2: the app's chat is how the owner's intent reaches the agent), so
// the default name is the owner's; ?user=<name> changes it on this device. Claude's messages arrive as "claude".
let me = 'jonghoon';
try {
  const q = new URLSearchParams(location.search).get('user');
  me = (q || localStorage.getItem('miniapp-user') || me).slice(0, 40);
  localStorage.setItem('miniapp-user', me);
} catch (e) {}
const touch = matchMedia('(pointer: coarse)').matches;
let view = {chat: [], consents: [], moves: [], forged: {}, app_tools: {}}, cards = [], pending = [], waiting = 0, seen = 0, drawn = '';
let heard = 0, unread = 0;                           // messages the agent sent first: how many are known, how many came while away
document.addEventListener('visibilitychange', () => { if (!document.hidden) { unread = 0; document.title = view.agent || 'Agent'; } });
const handled = new Set();

// An example page tool: the agent can show the person a card in the chat.
miniapp.offer('show_card', 'show the person a card in the chat; args {title, body}', a => {
  cards.push({who: 'card', title: a.title || '', text: a.body || '', ts: Date.now() / 1000}); draw(); return 'shown';
});

function draw() {
  const firsts = view.chat.filter(m => m.first);
  if (firsts.length > heard) {                       // the agent spoke first: say so when the person is looking elsewhere
    if (document.hidden) {
      unread += firsts.length - heard;
      document.title = `(${unread}) ${view.agent || 'Agent'}`;
      try { if (Notification.permission === 'granted') new Notification(view.agent || 'Agent', {body: firsts.at(-1).text}) } catch (e) {}
    }
    heard = firsts.length;
  }
  const items = view.chat.concat(cards).sort((a, b) => a.ts - b.ts);
  const mine = view.chat.filter(m => m.who === me).length;
  pending = pending.filter(p => mine <= p.base);
  const key = JSON.stringify([items.length, items.at(-1), pending, waiting, view.agent, new Date().toDateString()]);
  if (key === drawn) return;
  drawn = key;
  const sc = $('scroll'), atEnd = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80;
  const name = view.agent || 'Agent';
  if (!items.length && !pending.length) {
    $('log').innerHTML = `<div class="empty"><div class="avatar">${esc(name[0].toUpperCase())}</div><h2>${esc(name)}</h2>
      <p>골목에서 오래 장사해 온 가게 주인인데, 이 시장은 처음이라 배우는 중이에요. 이야기하는 동안에도 가게는 계속 열려 있습니다.</p>
      <div class="chips">${['지금 뭐 하고 있어?', '오늘 뭐 팔아?', '요즘 뭘 배웠어?', '만든 도구 보여줘'].map(s => `<button class="chip" type="button">${s}</button>`).join('')}</div></div>`;
    $('log').querySelectorAll('.chip').forEach(b => b.onclick = () => send(b.textContent));
    return;
  }
  let html = '', last = '', lastDay = '';
  items.forEach(m => {
    const d = m.ts ? dayLabel(m.ts) : lastDay;
    if (d !== lastDay) { lastDay = d; html += `<div class="day" role="heading" aria-level="2" data-day="${esc(d)}"><span>${esc(d)}</span></div>`; last = ''; }
    const gap = m.ts ? '<span class="gap" aria-hidden="true"></span>' : '';
    const st = m.ts ? ` <time class="stamp time" datetime="${new Date(m.ts * 1000).toISOString()}" aria-label="${esc(d + ' ' + hm(m.ts))}">${hm(m.ts)}</time>` : '';
    if (m.who === 'card') {
      html += `<div class="card"><div class="k">${esc(name)}</div><b>${esc(m.title)}</b><div>${esc(m.text)}</div></div>`;
    } else if (m.who === 'kit' || (m.who === 'agent' && KIT_LINES[m.text])) {
      // the kit's own notices are shown as Korean system lines, not as the agent's words (11/24); the record is unchanged
      html += `<div class="sys">${esc(m.who === 'kit' ? '키트 알림: ' + m.text : KIT_LINES[m.text])}</div>`;
    } else if (m.who === me) {
      html += `<div class="row me${last && last !== m.who ? ' turn' : ''}"><div class="bubble">${body(m.text, true)}${gap}${st}</div></div>`;
    } else {
      const cls = m.who === 'agent' ? 'agent' : 'other';
      // no name labels (11/24): the side and colour say who; only someone other than the agent signs inside the bubble
      const by = cls === 'other' ? `<span class="by"><span class="who">by ${esc(m.who === 'claude' ? 'Claude' : m.who)}</span>${st}</span>` : gap + st;
      html += `<div class="row ${cls}${last && last !== m.who ? ' turn' : ''}"><div class="bubble">${body(m.text, true)}${by}</div></div>`;
    }
    last = m.who;
  });
  // a reply waiting for its answer shows its quote box too (11/25, owner): same body() as a sent bubble
  for (const p of pending) html += `<div class="row me pending"><div class="bubble">${body(p.text, true)}</div></div>`;
  if (waiting) html += `<div class="row agent typing" role="status" aria-label="응답 작성 중"><div class="bubble"><i></i><i></i><i></i></div></div>`;
  $('log').innerHTML = html;
  if (atEnd || pending.length) sc.scrollTop = sc.scrollHeight;
}

// 24-hour time and a Korean date label ("오늘", "어제", "11월 24일 (화)") for the chat (11/25)
const hm = ts => new Date(ts * 1000).toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
function dayLabel(ts) {
  const d = new Date(ts * 1000), key = x => x.toDateString(), now = new Date(), y = new Date(now - 864e5);
  if (key(d) === key(now)) return '오늘';
  if (key(d) === key(y)) return '어제';
  return d.toLocaleDateString('ko-KR', {year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric', month: 'long', day: 'numeric', weekday: 'short'});
}
// while scrolling, the date of the topmost message stays pinned at the top, then fades (11/25, like Telegram)
(() => {
  const sc = $('scroll'), tip = $('daytip');
  let hide = null, touched = 0, holding = false, quiet = false;
  // only the person's own scrolling shows it, not the jump to the newest message when the chat redraws.
  // It stays while the finger is down or the list is still moving, and goes 3 s after both stop (11/25, owner).
  // A scroll that starts with a date pill already on screen does not bring it up: the date is in view (11/26, owner).
  const later = () => { clearTimeout(hide); if (!holding) hide = setTimeout(() => tip.classList.remove('on'), 3000); };
  const pillInView = () => {
    const r = sc.getBoundingClientRect();
    return [...$('log').querySelectorAll('.day')].some(d => { const b = d.getBoundingClientRect(); return b.bottom > r.top && b.top < r.bottom; });
  };
  const start = () => { if (!tip.classList.contains('on')) quiet = pillInView(); };
  ['wheel', 'keydown', 'pointerdown'].forEach(ev => sc.addEventListener(ev, () => {
    if (Date.now() - touched > 1000) start();
    touched = Date.now();
  }, {passive: true}));
  sc.addEventListener('touchmove', () => { touched = Date.now(); }, {passive: true});
  sc.addEventListener('touchstart', () => { holding = true; start(); touched = Date.now(); clearTimeout(hide); }, {passive: true});
  ['touchend', 'touchcancel'].forEach(ev => sc.addEventListener(ev, () => { holding = false; if (tip.classList.contains('on')) later(); }, {passive: true}));
  sc.addEventListener('scroll', () => {
    if (!holding && Date.now() - touched > 1000 && !tip.classList.contains('on')) return;
    const days = [...$('log').querySelectorAll('.day')];
    if (!days.length) return;
    const top = sc.getBoundingClientRect().top + 8;
    let cur = days[0];
    for (const d of days) { if (d.getBoundingClientRect().top <= top) cur = d; else break; }
    const pillShowing = days.some(d => { const r = d.getBoundingClientRect().top - top; return r > -8 && r < 36; });
    tip.firstChild.textContent = cur.dataset.day;
    tip.classList.toggle('on', !pillShowing && !quiet);
    later();
  }, {passive: true});
})();

function status() {
  const st = $('st'), on = Date.now() - seen < 6000;
  st.className = 'status ' + (!on ? 'off' : waiting ? 'busy' : 'on');
  $('stt').textContent = !on ? '연결 끊김' : waiting ? '답을 쓰는 중' : '시장에서 거래 중';
}
setInterval(status, 1000);

function list(el, rows) {
  el.innerHTML = rows.length ? `<div class="list">${rows.map(([a, b]) => `<div>${esc(a)}${b ? `<small>${esc(b)}</small>` : ''}</div>`).join('')}</div>`
                             : '<div class="none">아직 없습니다.</div>';
}

function showConsent() {
  const c = view.consents.find(c => !handled.has(c.id));
  $('consent').hidden = !c;
  if (!c) return;
  if ($('consent').dataset.id === c.id) return;
  $('consent').dataset.id = c.id;
  $('cname').innerHTML = `<span class="mono">${esc(c.name)}</span> 실행을 요청했습니다. 허용하면 이 내용 그대로 실행합니다.`;
  const args = Object.entries(c.args || {});
  $('cargs').innerHTML = args.length ? args.map(([k, v]) => `<div><span>${esc(k)}</span><span>${esc(typeof v === 'string' ? v : JSON.stringify(v))}</span></div>`).join('')
                                     : '<div><span>인자</span><span>없음</span></div>';
  const answer = ok => { handled.add(c.id); miniapp.consent(c.id, ok); $('consent').hidden = true; $('consent').dataset.id = ''; };
  $('yes').onclick = () => answer(true);
  $('no').onclick = () => answer(false);
}

miniapp.onState(s => {
  seen = Date.now();
  view = s;
  const name = s.agent || 'Agent';
  if ($('nm').textContent !== name) { $('nm').textContent = name; $('av').textContent = name[0].toUpperCase(); document.title = name; }
  draw(); status(); showConsent();
});

async function send(text) {
  text = text.trim();
  if (!text) return;
  try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission() } catch (e) {}
  pending.push({text, base: view.chat.filter(m => m.who === me).length + pending.length});
  waiting++; draw(); status();
  try { await miniapp.chat(text, me) } catch (e) {}
  waiting--; draw(); status();
}

const t = $('t');
function grow() { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; $('go').disabled = !t.value.trim(); }
t.addEventListener('input', grow);
t.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !touch) { e.preventDefault(); $('f').requestSubmit(); }
});
$('f').onsubmit = e => { e.preventDefault(); const v = t.value; t.value = ''; grow(); send(v); if (!touch) t.focus(); };
// iOS keeps the page height when the keyboard opens and scrolls the visible area instead (on iPad by a lot):
// follow the visible area's height and its offset, so the header stays on top and the message box sits right
// above the keyboard (11/25, owner's iPad).
const vv = window.visualViewport;
if (vv) {
  const root = document.documentElement.style;
  const fit = e => {
    if (vv.scale > 1.01) return;
    root.setProperty('--app-h', vv.height + 'px');
    root.setProperty('--app-y', Math.max(0, vv.offsetTop) + 'px');
    if (!e || e.type === 'resize') { const sc = $('scroll'); sc.scrollTop = sc.scrollHeight; }
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
}
draw();
</script>
<div class="msgmenu" id="msgmenu" role="menu" hidden>
  <button type="button" role="menuitem" data-act="reply">답장</button>
  <button type="button" role="menuitem" data-act="copy">복사</button>
</div>
<script>
// Reply to a message (11/24): long-press or right-click a bubble, pick 답장, and the message goes out with a one-line
// quote in front (> claude: "…", no ↪: iOS draws it as an emoji), so the agent knows what it answers. The kit's chat has no threads; the kit's
// script above is untouched: the quote is put into the field just before its own submit handler reads it.
(() => {
  const log = document.getElementById('log'), menu = document.getElementById('msgmenu'), field = document.getElementById('t');
  const bar = document.getElementById('replybar'), barText = document.getElementById('replytext');
  let target = null, reply = null, timer = null;
  const whoOf = row => {
    if (row.classList.contains('me')) return '나';
    if (row.classList.contains('agent')) return 'agent';
    for (let p = row.previousElementSibling; p; p = p.previousElementSibling) {
      if (p.classList.contains('name')) return p.textContent.trim();
      if (p.classList.contains('row') && !p.classList.contains('other')) break;
    }
    return 'claude';
  };
  const open = (bubble, x, y) => {
    target = bubble; menu.hidden = false;
    const r = menu.getBoundingClientRect();
    menu.style.left = Math.max(8, Math.min(x - r.width / 2, innerWidth - r.width - 8)) + 'px';
    menu.style.top = Math.max(8, y - r.height - 12) + 'px';
    menu.querySelector('button').focus({preventScroll: true});
  };
  const bubbleAt = e => { const b = e.target.closest('.bubble'); return b && !b.closest('.typing') ? b : null; };
  log.addEventListener('contextmenu', e => { const b = bubbleAt(e); if (!b) return; e.preventDefault(); open(b, e.clientX, e.clientY); });
  log.addEventListener('touchstart', e => {
    const b = bubbleAt(e); if (!b) return;
    const p = e.touches[0];
    timer = setTimeout(() => open(b, p.clientX, p.clientY), 450);
  }, {passive: true});
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev => log.addEventListener(ev, () => clearTimeout(timer), {passive: true}));
  document.addEventListener('pointerdown', e => { if (!menu.hidden && !menu.contains(e.target)) menu.hidden = true; }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') menu.hidden = true; });
  menu.addEventListener('click', async e => {
    const act = e.target.closest('button')?.dataset.act;
    if (!act || !target) return;
    const words = target.cloneNode(true); words.querySelectorAll('.stamp').forEach(s => s.remove());   // not the time (11/25)
    const text = words.textContent.trim();
    if (act === 'copy') { try { await navigator.clipboard.writeText(text); } catch (err) {} }
    else {
      reply = {who: whoOf(target.closest('.row')), text};
      barText.textContent = `답장: ${reply.who} · ${text.replace(/\s+/g, ' ')}`;
      bar.hidden = false; field.focus();
    }
    menu.hidden = true;
  });
  document.getElementById('replyx').onclick = () => { reply = null; bar.hidden = true; };
  // tap a reply's quote to jump to the message it quotes (found by its opening words; the kit's chat has no ids)
  const norm = s => s.replace(/\s+/g, ' ').trim();
  const jump = quote => {
    const m = /^[^:]{1,40}: "([\s\S]*?)(?:…)?"$/.exec(norm(quote.textContent));
    const want = norm(m ? m[1] : quote.textContent).slice(0, 40);
    const own = quote.closest('.bubble');
    // only the words of a bubble (not its own quote box or "by Claude"), and only bubbles above the tapped one
    const words = b => norm([...b.childNodes].filter(n => !n.classList?.contains('quote') && !n.classList?.contains('by') && !n.classList?.contains('stamp'))
      .map(n => n.textContent).join(''));
    const hit = [...log.querySelectorAll('.bubble')].reverse()
      .find(b => b !== own && !b.closest('.typing') && (b.compareDocumentPosition(own) & Node.DOCUMENT_POSITION_FOLLOWING)
                 && words(b).includes(want));
    if (!hit) {
      document.querySelector('.jump-note')?.remove();
      const n = Object.assign(document.createElement('div'), {className: 'jump-note', textContent: '원문을 찾지 못했어요'});
      n.setAttribute('role', 'status'); document.body.append(n); setTimeout(() => n.remove(), 1600); return;
    }
    hit.scrollIntoView({block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    hit.tabIndex = -1; hit.focus({preventScroll: true});
    clearTimeout(hit._found); hit.classList.add('found'); hit._found = setTimeout(() => hit.classList.remove('found'), 1500);
  };
  log.addEventListener('click', e => { const q = e.target.closest('.quote'); if (q) jump(q); });
  log.addEventListener('keydown', e => { const q = e.target.closest('.quote'); if (q && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); jump(q); } });
  // capture phase on the document: runs before the form's own submit handler, which reads the field
  document.addEventListener('submit', e => {
    if (e.target.id !== 'f' || !reply || !field.value.trim()) return;
    const q = reply.text.replace(/\s+/g, ' ');
    field.value = `> ${reply.who}: "${q.slice(0, 80)}${q.length > 80 ? '…' : ''}"\n${field.value}`;
    reply = null; bar.hidden = true;
  }, true);
})();
</script>
</body>
