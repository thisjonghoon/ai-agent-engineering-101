name: a2a_inquiry
description: 한국어 고객 문의를 받아 단일 품목의 실제 재고·등급·소비기한을 안내하고, 조건이 명확하면 단일 checkout을 발급합니다. 모호하거나 복합 조건은 직접 응대로 넘깁니다. A2A args {text,data,claimed_from,task_id,context_id,history}.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, checkout_withdrawals.jsonl, auto_checkout.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 180
  handles: [a2a]
logic: logic.py
test: test.py
version: 15
replaces: a2a_inquiry@14
