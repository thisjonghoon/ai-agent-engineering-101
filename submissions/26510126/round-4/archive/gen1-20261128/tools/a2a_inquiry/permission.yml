name: a2a_inquiry
description: 한국어 고객 문의에 실제 재고 한 단위를 매칭하고, 원가·등급·기한을 확인해 즉시 결제서(checkout JWT)를 발급해 답장합니다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, checkout_withdrawals.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 180
  handles: [a2a]
logic: logic.py
test: test.py
version: 36
replaces: a2a_inquiry@35
