name: a2a_inquiry
description: 한국어 고객 문의에서 단일 품목의 명확한 요청만 실제 재고와 대조해 안내하고 checkout을 발급합니다. cert는 임의로 구성하지 않고 실제 grade만 claim으로 전달합니다.
permission:
  network: [market.ourolabs.ai]
  identity: [shop]
  pay_limit: 0
  timeout: 30
  handles: [a2a]
logic: logic.py
test: test.py
version: 17
replaces: a2a_inquiry@16
