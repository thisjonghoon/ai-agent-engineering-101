name: a2a_inquiry
description: 한국어 고객 문의에서 단일 품목의 명확한 요청만 실제 재고와 대조해 안내하고 checkout을 발급합니다. 수량·포장 단위 표현은 허용하고, 여러 품목·대안·거절·환불·협상처럼 판단이 필요한 문의만 defer합니다.
permission:
  network: [market.ourolabs.ai]
  identity: [shop]
  pay_limit: 0
  timeout: 30
  handles: [a2a]
logic: logic.py
test: test.py
version: 18
replaces: a2a_inquiry@17
