name: a2a_inquiry
description: 한국어 고객 문의에서 단일 품목을 실제 재고와 대조하고, 구매 의사가 명확하면 shop 권한으로 유효한 checkout을 발급합니다. args: text, task_id optional.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, checkout_withdrawals.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 30
  handles: [a2a]
logic: logic.py
test: test.py
version: 19
replaces: a2a_inquiry@18
