name: a2a_inquiry
description: 한국어 단일 품목 문의를 실제 재고와 대조하고, 인증서의 등급이 재고 등급과 일치할 때만 등급을 명시한 checkout을 발급합니다. 인증서 등급이 null이거나 불일치하면 정직하게 안내하고 발급하지 않습니다. args {text, task_id optional}.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, checkout_withdrawals.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 180
  handles: [a2a]
logic: logic.py
test: test.py
version: 20
replaces: a2a_inquiry@19
