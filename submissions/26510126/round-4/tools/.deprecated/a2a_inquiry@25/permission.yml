name: a2a_inquiry
description: 한국어 단일 품목 문의를 실제 재고와 대조하고, 식품 인증서 grade가 비어 있어도 실제 등급·소비기한을 확인해 즉시 checkout을 발급합니다. args {text, task_id optional}
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, checkout_withdrawals.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 180
  handles: [a2a]
logic: logic.py
test: test.py
version: 25
replaces: a2a_inquiry@24
