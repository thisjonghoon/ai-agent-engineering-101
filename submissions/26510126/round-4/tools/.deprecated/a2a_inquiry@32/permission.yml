name: a2a_inquiry
description: 한국어 고객 문의를 실제 재고와 대조해 단일 품목의 등급·기한·가격을 안내하고 구매 의사이면 같은 응답에서 checkout JWT를 발급합니다. 단독 ‘면’ 부분문자열로 비국수 문의를 오인하지 않습니다. args {text, task_id optional}
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, checkout_withdrawals.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 180
  handles: [a2a]
logic: logic.py
test: test.py
version: 32
replaces: a2a_inquiry@31
