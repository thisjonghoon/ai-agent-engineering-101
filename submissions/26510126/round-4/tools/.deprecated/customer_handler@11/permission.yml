name: customer_handler
description: 고객 품목 요청을 판별하고 실제 shop 서명으로 checkout_jwt를 발급하며 품목별 예약을 안전하게 관리하는 한국어 고객 핸들러
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 11
replaces: customer_handler@10
