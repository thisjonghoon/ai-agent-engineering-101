name: customer_handler
description: 카드의 공개 재고 전체를 읽어 고객의 구매 품목을 SKU에 매칭하고, 재고가 있으면 가격·등급·인증서 등급·잔여시간을 안내하며 shop 서명 checkout_jwt와 단위별 예약을 생성하는 한국어 고객 핸들러
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json, test_card.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 13
replaces: customer_handler@12
