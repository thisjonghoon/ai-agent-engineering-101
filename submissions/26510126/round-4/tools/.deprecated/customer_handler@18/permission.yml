name: customer_handler
description: 카드 재고 SKU와 시장 catalog 표를 매칭해 고객 원문에서 품목을 찾고, 조건을 안내하며 서명 checkout을 생성한다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json, catalog.json, test_catalog.json, test_card.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 18
replaces: customer_handler@17
