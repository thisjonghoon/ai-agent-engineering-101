name: customer_handler
description: A2A 고객 요청에 답하고 재고를 안내한다. 구매 요청이면 조건에 맞는 SKU를 선택해 ACP checkout session을 만들고 checkout_jwt를 고객에게 전달한다. args는 text,data,claimed_from,task_id,context_id,history이다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, card.json, handler_state.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 2
replaces: customer_handler@1
