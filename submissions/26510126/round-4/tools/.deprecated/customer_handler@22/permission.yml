name: customer_handler
description: 카드의 20개 재고 SKU를 catalog.json 메타데이터 표로 매칭하고 고객 구매 요청에 등급·인증서 등급·잔여시간과 원가 하한 이상의 서명 checkout을 제공한다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json, catalog.json, test_catalog.json, test_card.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 22
replaces: customer_handler@21
