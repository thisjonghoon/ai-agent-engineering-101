name: customer_handler
description: 카드의 모든 재고 SKU를 시장 catalog.json의 품목명·등급·unit·원가 메타데이터 표로 매칭하고, 21시 이후 고객 원문을 처리해 조건에 맞는 서명 checkout과 예약을 제공한다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json, catalog.json, test_catalog.json, test_card.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 23
replaces: customer_handler@22
