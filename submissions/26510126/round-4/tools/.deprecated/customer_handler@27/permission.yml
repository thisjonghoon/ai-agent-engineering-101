name: customer_handler
description: GET /api/inventory의 실제 unit 메타데이터로 고객 요청 품목을 매칭하고, 가격 하한 이상이면 checkout JWT와 예약을 생성하는 한국어 핸들러
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json, catalog.json, test_catalog.json, test_card.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 27
replaces: customer_handler@26
