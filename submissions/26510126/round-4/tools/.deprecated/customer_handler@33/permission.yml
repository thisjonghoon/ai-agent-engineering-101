name: customer_handler
description: 시장 /api/inventory에서 shop 토큰으로 실제 단위 메타데이터를 조회하고 고객 요청에 맞는 재고 단위의 하한 이상 checkout JWT와 예약을 생성하는 한국어 핸들러
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json, catalog.json, test_catalog.json, test_card.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 33
replaces: customer_handler@32
