name: customer_handler
description: 카탈로그 표와 실제 재고를 사용해 고객 요청과 동일한 품목·unit만 선택하고 clearing house 정산 필드를 포함한 checkout JWT와 예약을 생성한다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json, catalog.json, test_catalog.json, test_card.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 36
replaces: customer_handler@35
