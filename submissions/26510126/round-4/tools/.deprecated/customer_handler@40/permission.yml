name: customer_handler
description: 카드 재고와 catalog 메타데이터를 SKU별로 결합하고 품목 낱말을 매칭해 정산소 checkout JWT와 고객 예약을 생성한다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json, catalog.json, test_catalog.json, test_card.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 40
replaces: customer_handler@39
