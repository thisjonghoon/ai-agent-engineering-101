name: customer_handler
description: 고객 요청의 품목 낱말을 카탈로그·재고 품목명에 매칭해 잠기지 않은 unit으로 원가 하한 이상 checkout을 생성하고, 실제 고객일 때만 잠금을 기록한다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json, catalog.json, test_catalog.json, test_card.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 44
replaces: customer_handler@43
