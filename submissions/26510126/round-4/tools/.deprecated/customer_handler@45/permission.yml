name: customer_handler
description: 고객 원문을 상품명·SKU의 의미 있는 품목 낱말로만 엄격히 매칭해 용량만 겹치는 다른 상품을 선택하지 않고, 김치처럼 상품명에 포함된 품목 낱말도 처리하며 원가 하한 이상 checkout과 예약을 생성한다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json, catalog.json, test_catalog.json, test_card.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 45
replaces: customer_handler@44
