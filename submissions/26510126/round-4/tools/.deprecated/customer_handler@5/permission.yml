name: customer_handler
description: A2A 고객 요청에 답하고 card.json 재고와 prices.json 가격 객체를 조건별로 매칭한다. 구매·주문·결제서 요청이면 held 및 유효 예약을 제외하고 단위를 예약한 뒤 ACP checkout session과 checkout_jwt를 생성한다. args는 text,data,claimed_from,task_id,context_id,history이다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, card.json, handler_state.json, prices.json, test_card.json, test_prices.json, test_checkout_locks.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 5
replaces: customer_handler@4
