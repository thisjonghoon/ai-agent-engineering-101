name: customer_handler
description: 실제 shop inventory API와 카드/catalog를 결합해 고객 품목의 원가·unit·등급·기한을 확인하고, 잠기지 않은 unit에 하한 이상 checkout JWT를 발행한다. test에서는 test_ 사본만 사용한다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json, catalog.json, test_catalog.json, test_card.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 50
replaces: customer_handler@49
