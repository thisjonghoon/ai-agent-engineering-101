name: customer_handler
description: 실제 shop inventory와 카드/catalog를 병합해 고객 요청 품목의 SKU·unit을 찾고 하한 이상 checkout JWT와 예약을 발행한다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, test_checkout_locks.json, catalog.json, test_catalog.json, test_card.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 54
replaces: customer_handler@53
