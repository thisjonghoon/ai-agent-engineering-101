name: customer_handler
description: A2A 고객 요청에 답하고 SKU-only 카드 재고를 품목 별칭과 조건별로 매칭하며 구매 시 예약·서명된 checkout_jwt를 생성한다.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, card.json, handler_state.json, prices.json, test_card.json, test_prices.json, test_checkout_locks.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 20
  handles: [a2a]
logic: logic.py
test: test.py
version: 7
replaces: customer_handler@6
