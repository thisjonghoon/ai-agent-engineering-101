name: make_checkout
description: 재고와 원가를 확인하고, 마지막 결제서가 3시간 이내면 거절합니다. 3시간이 지났고 공개 원장에 해당 unit 정산이 없으면 결제서를 스스로 무효 기록한 뒤 새 결제서를 발급합니다. args {sku,unit,price,cost,cert?,claim?,task?,warranty_hours?,allow_loss?}.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, checkout_withdrawals.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 180
logic: logic.py
test: test.py
version: 6
replaces: make_checkout@5
