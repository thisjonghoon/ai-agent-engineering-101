name: a2a_inquiry
description: 품목 문의에 조건과 넉넉한 기한을 확인하여 결제서를 제공하고 발급·응답 원문과 전달 확인 상태를 기록합니다.
permission:
  network: [market.ourolabs.ai, rpc-testnet.maroo.io]
  write: [checkout_locks.json, checkout_withdrawals.jsonl, auto_checkout.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  timeout: 180
  handles: [a2a]
logic: logic.py
test: test.py
version: 12
replaces: a2a_inquiry@11
