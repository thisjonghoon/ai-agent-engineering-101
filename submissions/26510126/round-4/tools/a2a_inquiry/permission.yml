name: a2a_inquiry
description: 한국어 고객 문의를 실제 재고와 대조해 품목·등급·기한 조건을 지키고, 구매 의사이면 같은 응답에서 checkout JWT를 발급합니다. 품목명 바로 뒤의 부정·대체 표현만 제외합니다. args {text, task_id optional}
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json, checkout_withdrawals.jsonl]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 180
  handles: [a2a]
logic: logic.py
test: test.py
version: 30
replaces: a2a_inquiry@29
