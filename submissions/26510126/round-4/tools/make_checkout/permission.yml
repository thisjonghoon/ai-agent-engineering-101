name: make_checkout
description: 재고 API의 단위·실제 원가·현재 등급·인증서를 확인하고 기존 발급 이력이 없을 때만 결제서를 서명합니다. args {sku, unit, price, cost, cert optional, claim optional, warranty_hours optional, task optional, allow_loss optional}.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 30
logic: logic.py
test: test.py
version: 3
replaces: make_checkout@2
