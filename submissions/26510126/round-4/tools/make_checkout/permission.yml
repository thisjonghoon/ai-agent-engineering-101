name: make_checkout
description: 실제 재고·원가·등급·인증서를 확인하고 소비기한이 없거나 유효한 상품의 서명된 checkout을 발급합니다. args {sku,unit,price,cost,cert?,claim?,task?,warranty_hours?}.
permission:
  network: [market.ourolabs.ai]
  write: [checkout_locks.json]
  identity: [shop]
  wallet: [sign_jwt]
  pay_limit: 0
  timeout: 180
logic: logic.py
test: test.py
version: 7
replaces: make_checkout@6
